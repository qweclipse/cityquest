services:
  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_APP_NAME: CityQuest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    command: php artisan serve --host=0.0.0.0 --port=8000
    env_file:
      - ./backend/.env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the local root .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: cityquest
      POSTGRES_USER: cityquest
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the local root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityquest -d cityquest"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  frontend_node_modules:
  backend_vendor:
  postgres_data:
  redis_data:
