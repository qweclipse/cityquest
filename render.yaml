services:
  - type: web
    name: cityquest-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: deployment/first-public-hosting
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: CityQuest
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          name: cityquest-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        sync: false
      - key: APP_LOCALE
        value: ru
      - key: APP_FALLBACK_LOCALE
        value: ru
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_DEPRECATIONS_CHANNEL
        value: "null"
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_SEARCH_PATH
        value: cityquest,gis
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: '#^https://cityquest-web(?:-[a-z0-9-]+)*\.vercel\.app$#'
      - key: SEED_DATABASE
        value: "true"
